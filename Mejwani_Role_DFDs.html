<!DOCTYPE html>

<head>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#f5f5f5; font-family:'Times New Roman',serif; }

.topbar {
  background:#1e3a5f; color:white; padding:8px 12px;
  display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:6px;
}
.topbar h1 { font-size:13px; font-family:sans-serif; }
.topbar button {
  background:#2563eb; color:white; border:none; padding:6px 14px;
  border-radius:5px; font-size:12px; cursor:pointer; font-family:sans-serif;
}

.tabs {
  display:flex; gap:4px; padding:8px 12px; background:#e8e8e8;
  flex-wrap:wrap; border-bottom:2px solid #1e3a5f;
}
.tab {
  padding:5px 14px; border-radius:4px 4px 0 0; cursor:pointer;
  font-size:12px; font-family:sans-serif; border:1px solid #bbb;
  background:#fff; color:#333;
}
.tab.active { background:#1e3a5f; color:white; border-color:#1e3a5f; }

.panel { display:none; }
.panel.active { display:block; }

.page {
  width:210mm; margin:0 auto; background:white;
  padding:8mm 7mm 6mm; min-height:270mm;
}
.page-title {
  text-align:center; font-size:13pt; font-weight:bold;
  margin-bottom:5mm; font-family:'Times New Roman',serif;
}

@media print {
  .topbar, .tabs { display:none !important; }
  body { background:white; }
  .panel { display:block !important; }
  .panel:not(.active) { display:none !important; }
  .page { width:100%; padding:6mm; }
  @page { size:A4 portrait; margin:0; }
}
</style>
</head>

<div class="topbar">
  <h1>🍽️ Mejwani — Role-wise DFD (1st Level)</h1>
  <button onclick="window.print()">🖨️ Print Active Tab</button>
</div>

<div class="tabs">
  <div class="tab active"   onclick="show('sa')">🔑 Super Admin</div>
  <div class="tab"          onclick="show('ad')">🧑‍💼 Admin</div>

  <div class="tab"          onclick="show('cu')">🧑 Customer</div>
